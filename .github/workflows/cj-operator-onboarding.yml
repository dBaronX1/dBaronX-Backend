name: CJ Operator Onboarding

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Operator mode: readiness, preview, import, approve-safe, publish-approved, full-safe"
        required: true
        default: "preview"
        type: choice
        options:
          - "readiness"
          - "preview"
          - "import"
          - "approve-safe"
          - "publish-approved"
          - "full-safe"
      category:
        description: "Supplier category to process. Use all with limit 5 first; high limits are heavy."
        required: true
        default: "all"
        type: choice
        options:
          - "all"
          - "electronics"
          - "fashion"
          - "home-living"
          - "beauty"
          - "sports"
          - "automotive"
          - "agriculture"
          - "tech"
          - "finance"
      limitPerCategory:
        description: "Safe first value: 5. Default: 5. Heavy: 50 with category=all."
        required: true
        default: "5"
        type: string
      dryRun:
        description: "Run without mutating product records."
        required: true
        default: "true"
        type: choice
        options:
          - "true"
          - "false"
      readinessExitZero:
        description: "Allow readiness diagnostics to exit zero."
        required: true
        default: "true"
        type: choice
        options:
          - "true"
          - "false"
jobs:
  run-cj-operator:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - uses: pnpm/action-setup@v4
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter dbaronx-api build
      - name: Run CJ operator and capture JSON output
        id: operator-run
        shell: bash
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          MEDUSA_BASE_URL: ${{ secrets.MEDUSA_BASE_URL || vars.MEDUSA_BASE_URL }}
          MEDUSA_URL: ${{ secrets.MEDUSA_URL || vars.MEDUSA_URL }}
          MEDUSA_ADMIN_API_KEY: ${{ secrets.MEDUSA_ADMIN_API_KEY }}
          MEDUSA_API_KEY: ${{ secrets.MEDUSA_API_KEY }}
          MEDUSA_PUBLISHABLE_KEY: ${{ secrets.MEDUSA_PUBLISHABLE_KEY || vars.MEDUSA_PUBLISHABLE_KEY }}
          CJ_ACCESS_TOKEN: ${{ secrets.CJ_ACCESS_TOKEN }}
          CJ_API_KEY: ${{ secrets.CJ_API_KEY }}
          CJ_OPERATOR_MODE: ${{ inputs.mode }}
          CJ_OPERATOR_CATEGORY: ${{ inputs.category }}
          CJ_OPERATOR_LIMIT_PER_CATEGORY: ${{ inputs.limitPerCategory }}
          CJ_OPERATOR_DRY_RUN: ${{ inputs.dryRun }}
          CJ_OPERATOR_READINESS_EXIT_ZERO: ${{ inputs.readinessExitZero }}
          DBX_CONFIRM_CJ_OPERATOR_ONBOARDING: true
        run: |
          set -o pipefail
          mkdir -p artifacts
          output_path="artifacts/cj-operator-output.json"
          dist_script="apps/api/dist/scripts/cj-operator-onboard-products.js"
          dist_script_present=false; test -s "$dist_script" && dist_script_present=true
          echo "operatorStarted=true"
          echo "outputPath=${output_path}"
          echo "mode=${CJ_OPERATOR_MODE}"
          echo "dryRun=${CJ_OPERATOR_DRY_RUN}"
          echo "category=${CJ_OPERATOR_CATEGORY}"
          echo "limitPerCategory=${CJ_OPERATOR_LIMIT_PER_CATEGORY}"
          echo "recommendedFirstPreview=category=all limitPerCategory=5"
          echo "heavyPreviewWarning=category=all limitPerCategory=50 is supported but heavy; run category=all limitPerCategory=5 successfully end-to-end first"
          echo "cwd=$(pwd)"
          echo "distScriptPresent=${dist_script_present}"
          db_present=false; [ -n "${DATABASE_URL}" ] && db_present=true
          supabase_url_present=false; [ -n "${SUPABASE_URL}" ] && supabase_url_present=true
          supabase_service_role_present=false; [ -n "${SUPABASE_SERVICE_ROLE_KEY}" ] && supabase_service_role_present=true
          cj_access_token_present=false; [ -n "${CJ_ACCESS_TOKEN}" ] && cj_access_token_present=true
          cj_api_key_present=false; [ -n "${CJ_API_KEY}" ] && cj_api_key_present=true
          cj_credential_present=false; if [ "$cj_access_token_present" = "true" ] || [ "$cj_api_key_present" = "true" ]; then cj_credential_present=true; fi
          cj_api_base_url_present=false; [ -n "${CJ_API_BASE_URL:-}" ] && cj_api_base_url_present=true
          missing_secrets_json=$(DATABASE_URL_PRESENT="$db_present" SUPABASE_URL_PRESENT="$supabase_url_present" SUPABASE_SERVICE_ROLE_KEY_PRESENT="$supabase_service_role_present" CJ_CREDENTIAL_PRESENT="$cj_credential_present" node -e "const m=[];if(process.env.DATABASE_URL_PRESENT!=='true')m.push('DATABASE_URL');if(process.env.SUPABASE_URL_PRESENT!=='true')m.push('SUPABASE_URL');if(process.env.SUPABASE_SERVICE_ROLE_KEY_PRESENT!=='true')m.push('SUPABASE_SERVICE_ROLE_KEY');if(process.env.CJ_CREDENTIAL_PRESENT!=='true')m.push('CJ_ACCESS_TOKEN_or_CJ_API_KEY');process.stdout.write(JSON.stringify(m));")
          if [ "$missing_secrets_json" != "[]" ]; then
            MISSING="$missing_secrets_json" OUTPUT_PATH="$output_path" CJ_ACCESS_TOKEN_PRESENT="$cj_access_token_present" CJ_API_KEY_PRESENT="$cj_api_key_present" CJ_CREDENTIAL_PRESENT="$cj_credential_present" CJ_API_BASE_URL_PRESENT="$cj_api_base_url_present" node -e "const fs=require('node:fs');const missing=JSON.parse(process.env.MISSING);const payload={success:false,mode:process.env.CJ_OPERATOR_MODE,dryRun:String(process.env.CJ_OPERATOR_DRY_RUN)==='true',requestedLimitPerCategory:Number(process.env.CJ_OPERATOR_LIMIT_PER_CATEGORY||50),totalCategories:0,categoryResults:[],totalPreviewed:0,totalFetched:0,totalStaged:0,totalApproved:0,totalPublished:0,totalRejected:0,totalSkipped:0,totalMedusaSynced:0,blockers:['github_secret_missing'],medusaSyncBlockers:[],missingSecrets:missing,dbDiagnostics:{},cjDiagnostics:{cjAccessTokenPresent:process.env.CJ_ACCESS_TOKEN_PRESENT==='true',cjApiKeyPresent:process.env.CJ_API_KEY_PRESENT==='true',cjCredentialConfigured:process.env.CJ_ACCESS_TOKEN_PRESENT==='true',acceptedCredentialEnvNames:['CJ_ACCESS_TOKEN'],adapterCredentialSource:process.env.CJ_ACCESS_TOKEN_PRESENT==='true'?'CJ_ACCESS_TOKEN':null,runtimeCredentialSource:process.env.CJ_ACCESS_TOKEN_PRESENT==='true'?'CJ_ACCESS_TOKEN':null,requiredRuntimeCredential:'CJ_ACCESS_TOKEN',cjAuthMode:process.env.CJ_ACCESS_TOKEN_PRESENT==='true'?'cj_access_token_header':'missing_access_token',cjEndpointPath:'/v1/product/list',cjApiVersion:'api2.0',cjAuthHeaderNamePresent:true,cjRequestMethod:'GET',cjApiBaseUrlConfigured:process.env.CJ_API_BASE_URL_PRESENT==='true',workflowCredentialPrecheckPresent:process.env.CJ_CREDENTIAL_PRESENT==='true',adapterCredentialPrecheckMismatch:false},medusaDiagnostics:{},errorName:null,errorMessage:null,errorStackPreview:[],nextAction:'Add missing secrets and rerun.'};fs.writeFileSync(process.env.OUTPUT_PATH,JSON.stringify(payload,null,2)+'\n');"
            if [ "${{ inputs.mode }}" = "readiness" ] && [ "${{ inputs.readinessExitZero }}" = "true" ]; then exit 0; else exit 1; fi
          fi
          operator_exit_code=0
          if [ "$dist_script_present" != "true" ]; then
            OUTPUT_PATH="$output_path" node -e "const fs=require('node:fs');const payload={success:false,mode:process.env.CJ_OPERATOR_MODE,dryRun:String(process.env.CJ_OPERATOR_DRY_RUN)==='true',requestedLimitPerCategory:Number(process.env.CJ_OPERATOR_LIMIT_PER_CATEGORY||50),totalCategories:0,categoryResults:[],totalPreviewed:0,totalFetched:0,totalStaged:0,totalApproved:0,totalPublished:0,totalRejected:0,totalSkipped:0,totalMedusaSynced:0,blockers:['operator_dist_missing'],medusaSyncBlockers:[],missingSecrets:[],dbDiagnostics:{},cjDiagnostics:{},medusaDiagnostics:{},errorName:'DistScriptMissing',errorMessage:'Compiled operator script not found at apps/api/dist/scripts/cj-operator-onboard-products.js',errorStackPreview:[],nextAction:'Build apps/api and rerun.'};fs.writeFileSync(process.env.OUTPUT_PATH,JSON.stringify(payload,null,2)+'\n');"
            operator_exit_code=1
          else
            CJ_OPERATOR_OUTPUT_PATH="$output_path" node "$dist_script" > artifacts/cj-operator-stdout.log 2> artifacts/cj-operator-stderr.log || operator_exit_code=$?
          fi
          if [ ! -s "$output_path" ]; then
            OUTPUT_PATH="$output_path" EXIT_CODE="$operator_exit_code" DIST_SCRIPT="$dist_script" node -e "const fs=require('node:fs');const stderrPath='artifacts/cj-operator-stderr.log';const stdoutPath='artifacts/cj-operator-stdout.log';const err=fs.existsSync(stderrPath)?fs.readFileSync(stderrPath,'utf8').split('\n').filter(Boolean).slice(0,8):[];const stdout=fs.existsSync(stdoutPath)?fs.readFileSync(stdoutPath,'utf8').split('\n').filter(Boolean).slice(0,8):[];const stderrSize=fs.existsSync(stderrPath)?fs.statSync(stderrPath).size:0;const stdoutSize=fs.existsSync(stdoutPath)?fs.statSync(stdoutPath).size:0;const payload={success:false,mode:process.env.CJ_OPERATOR_MODE,dryRun:String(process.env.CJ_OPERATOR_DRY_RUN)==='true',requestedLimitPerCategory:Number(process.env.CJ_OPERATOR_LIMIT_PER_CATEGORY||50),totalCategories:0,categoryResults:[],totalPreviewed:0,totalFetched:0,totalStaged:0,totalApproved:0,totalPublished:0,totalRejected:0,totalSkipped:0,totalMedusaSynced:0,blockers:['operator_exception'],medusaSyncBlockers:[],missingSecrets:[],dbDiagnostics:{distScriptPath:process.env.DIST_SCRIPT,stdoutSize,stderrSize,exitCode:Number(process.env.EXIT_CODE||0)},cjDiagnostics:{},medusaDiagnostics:{},errorName:'OperatorOutputMissing',errorMessage:'Operator process exited without writing output JSON.',errorStackPreview:err.length?err:stdout,nextAction:'Inspect logs and rerun.'};fs.writeFileSync(process.env.OUTPUT_PATH,JSON.stringify(payload,null,2)+'\n');"
          fi
          echo "operatorExitCode=${operator_exit_code}" >> "$GITHUB_OUTPUT"
      - name: Validate operator output contract
        if: always()
        run: |
          test -s artifacts/cj-operator-output.json
          node -e "const fs=require('node:fs');const mode=String(process.env.CJ_OPERATOR_MODE||'');const p=JSON.parse(fs.readFileSync('artifacts/cj-operator-output.json','utf8'));const strict=new Set(['preview','import','approve-safe','publish-approved','full-safe']);if(strict.has(mode)&&p.success!==true){process.exit(1);}"
        env:
          CJ_OPERATOR_MODE: ${{ inputs.mode }}
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cj-operator-artifacts
          path: |
            artifacts/cj-operator-output.json
            artifacts/cj-operator-stdout.log
            artifacts/cj-operator-stderr.log
          if-no-files-found: error
