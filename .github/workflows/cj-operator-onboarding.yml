name: CJ Operator Onboarding

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Operator mode
        type: choice
        options: [readiness, preview, import, approve-safe, publish-approved, full-safe]
        default: readiness
      category:
        description: Category slug
        type: choice
        options: [all, electronics, fashion, home-living, beauty, sports, automotive, agriculture, tech, finance]
        default: all
      limitPerCategory:
        description: Requested products per category
        required: false
        default: '50'
      dryRun:
        description: Dry run only
        type: boolean
        default: true
      readinessExitZero:
        description: Exit 0 in readiness mode when blockers exist
        type: boolean
        default: true
jobs:
  run-cj-operator:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - uses: pnpm/action-setup@v4
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter dbaronx-api build
      - name: Run CJ operator and capture JSON output
        id: operator-run
        shell: bash
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          CJ_ACCESS_TOKEN: ${{ secrets.CJ_ACCESS_TOKEN }}
          CJ_API_KEY: ${{ secrets.CJ_API_KEY }}
          CJ_OPERATOR_MODE: ${{ inputs.mode }}
          CJ_OPERATOR_CATEGORY: ${{ inputs.category }}
          CJ_OPERATOR_LIMIT_PER_CATEGORY: ${{ inputs.limitPerCategory }}
          CJ_OPERATOR_DRY_RUN: ${{ inputs.dryRun }}
          CJ_OPERATOR_READINESS_EXIT_ZERO: ${{ inputs.readinessExitZero }}
          DBX_CONFIRM_CJ_OPERATOR_ONBOARDING: true
        run: |
          set -o pipefail
          mkdir -p artifacts
          db_present=false; [ -n "${DATABASE_URL}" ] && db_present=true
          supabase_url_present=false; [ -n "${SUPABASE_URL}" ] && supabase_url_present=true
          supabase_service_role_present=false; [ -n "${SUPABASE_SERVICE_ROLE_KEY}" ] && supabase_service_role_present=true
          cj_access_token_present=false; [ -n "${CJ_ACCESS_TOKEN}" ] && cj_access_token_present=true
          cj_api_key_present=false; [ -n "${CJ_API_KEY}" ] && cj_api_key_present=true
          cj_credential_present=false; if [ "$cj_access_token_present" = "true" ] || [ "$cj_api_key_present" = "true" ]; then cj_credential_present=true; fi
          missing_secrets_json=$(DATABASE_URL_PRESENT="$db_present" SUPABASE_URL_PRESENT="$supabase_url_present" SUPABASE_SERVICE_ROLE_KEY_PRESENT="$supabase_service_role_present" CJ_CREDENTIAL_PRESENT="$cj_credential_present" node -e "const m=[];if(process.env.DATABASE_URL_PRESENT!=='true')m.push('DATABASE_URL');if(process.env.SUPABASE_URL_PRESENT!=='true')m.push('SUPABASE_URL');if(process.env.SUPABASE_SERVICE_ROLE_KEY_PRESENT!=='true')m.push('SUPABASE_SERVICE_ROLE_KEY');if(process.env.CJ_CREDENTIAL_PRESENT!=='true')m.push('CJ_ACCESS_TOKEN_or_CJ_API_KEY');process.stdout.write(JSON.stringify(m));")
          if [ "$missing_secrets_json" != "[]" ]; then
            MISSING="$missing_secrets_json" node -e "const fs=require('node:fs');const missing=JSON.parse(process.env.MISSING);const payload={success:false,mode:process.env.CJ_OPERATOR_MODE,dryRun:String(process.env.CJ_OPERATOR_DRY_RUN)==='true',requestedLimitPerCategory:Number(process.env.CJ_OPERATOR_LIMIT_PER_CATEGORY||50),totalCategories:0,categoryResults:[],totalPreviewed:0,totalStaged:0,totalApproved:0,totalPublished:0,totalRejected:0,totalSkipped:0,blockers:['github_secret_missing'],missingSecrets:missing,dbDiagnostics:{},cjDiagnostics:{},nextAction:'Add missing secrets and rerun.'};fs.writeFileSync('artifacts/cj-operator-output.json',JSON.stringify(payload,null,2)+'\n');"
            if [ "${{ inputs.mode }}" = "readiness" ] && [ "${{ inputs.readinessExitZero }}" = "true" ]; then exit 0; else exit 1; fi
          fi
          operator_exit_code=0
          node apps/api/dist/scripts/cj-operator-onboard-products.js > artifacts/cj-operator-output.json || operator_exit_code=$?
          if [ ! -s artifacts/cj-operator-output.json ]; then
            node -e "const fs=require('node:fs');const payload={success:false,mode:process.env.CJ_OPERATOR_MODE,dryRun:String(process.env.CJ_OPERATOR_DRY_RUN)==='true',requestedLimitPerCategory:Number(process.env.CJ_OPERATOR_LIMIT_PER_CATEGORY||50),totalCategories:0,categoryResults:[],totalPreviewed:0,totalStaged:0,totalApproved:0,totalPublished:0,totalRejected:0,totalSkipped:0,blockers:['operator_output_empty'],missingSecrets:[],dbDiagnostics:{},cjDiagnostics:{},nextAction:'Inspect logs and rerun.'};fs.writeFileSync('artifacts/cj-operator-output.json',JSON.stringify(payload,null,2)+'\n');"
          fi
          echo "operatorExitCode=${operator_exit_code}" >> "$GITHUB_OUTPUT"
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cj-operator-output
          path: artifacts/cj-operator-output.json
          if-no-files-found: error
