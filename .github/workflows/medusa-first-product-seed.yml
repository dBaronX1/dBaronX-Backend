name: Medusa First Product Seed

on:
  workflow_dispatch:
    inputs:
      confirmSeed:
        description: "Type true to authorize the controlled verified CJ first product seed."
        required: true
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
      dryRun:
        description: "Keep true for preflight-only diagnostics; set false for the actual Medusa seed."
        required: true
        default: "true"
        type: choice
        options:
          - "true"
          - "false"
      runMigrations:
        description: "Run Medusa migrations only when the DB preflight says migrations are missing. Default false."
        required: true
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

permissions:
  contents: read

env:
  NODE_VERSION: "20"
  MEDUSA_BASE_URL: https://dbaronx-medusa-xrwh.onrender.com
  API_BASE_URL: https://dbaronx-api-unified-qo2j.onrender.com
  FASTAPI_BASE_URL: https://dbaronx-fastapi-5ci9.onrender.com
  BOT_BASE_URL: https://dbaronx-telegram-bot.onrender.com
  DBX_MEDUSA_DB_CONTRACT_OUTPUT_PATH: artifacts/medusa-db-contract.json
  DBX_FIRST_PRODUCT_SEED_OUTPUT_PATH: artifacts/medusa-first-product-seed-output.json
  DBX_COMMERCE_ENSURE_OUTPUT_PATH: artifacts/medusa-commerce-ensure-output.json
  MEDUSA_ADMIN_API_KEY: ${{ secrets.MEDUSA_ADMIN_API_KEY }}
  MEDUSA_API_KEY: ${{ secrets.MEDUSA_API_KEY }}
  # Medusa-only database contract: both variables intentionally come from MEDUSA_DATABASE_URL.
  # If this workflow uses a GitHub Environment, update the Environment secret too.
  DATABASE_URL: ${{ secrets.MEDUSA_DATABASE_URL }}
  MEDUSA_DATABASE_URL: ${{ secrets.MEDUSA_DATABASE_URL }}

jobs:
  seed:
    name: Seed verified first CJ product
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Require Medusa seed inputs and database secret
        run: |
          set -euo pipefail
          mkdir -p artifacts
          if [ -z "${MEDUSA_DATABASE_URL:-}" ]; then
            echo "medusa_database_url_missing" >&2
            printf '%s\n' '{"success":false,"errorCode":"medusa_database_url_missing","usingMedusaDatabaseSecret":true,"usingGenericDatabaseSecret":false,"databaseUrlEqualsMedusaDatabaseUrl":true,"secretSourceHint":"MEDUSA_DATABASE_URL","medusaWorkflowDatabaseContract":"DATABASE_URL_AND_MEDUSA_DATABASE_URL_BOTH_FROM_MEDUSA_DATABASE_URL_SECRET","nextAction":"Set the GitHub repository secret MEDUSA_DATABASE_URL to the real Medusa database URL and update any GitHub Environment secret MEDUSA_DATABASE_URL if this workflow uses an Environment; do not use the API Supabase DATABASE_URL."}' > artifacts/medusa-db-contract.json
            exit 1
          fi
          if [ "${{ inputs.confirmSeed }}" != "true" ]; then
            echo "confirmSeed must be true to authorize the first CJ product seed." >&2
            exit 1
          fi
          echo "Medusa database secret is present; value intentionally not printed."

      - name: Check out repository
        uses: actions/checkout@v4

      - name: Enable pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.0.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Medusa
        run: pnpm --filter @dbaronx/medusa build

      - name: Run Medusa DB contract preflight
        id: medusa_db_contract
        continue-on-error: true
        run: node scripts/e2e-medusa-database-contract-smoke.mjs

      - name: Run Medusa migrations when explicitly allowed
        if: steps.medusa_db_contract.outcome == 'failure' && inputs.runMigrations == 'true'
        run: pnpm --filter @dbaronx/medusa run db:migrate

      - name: Re-run Medusa DB contract preflight after migrations
        if: steps.medusa_db_contract.outcome == 'failure' && inputs.runMigrations == 'true'
        run: node scripts/e2e-medusa-database-contract-smoke.mjs

      - name: Stop before seed when Medusa DB is not ready
        if: steps.medusa_db_contract.outcome == 'failure' && inputs.runMigrations != 'true'
        run: |
          echo "wrong_database_or_medusa_migrations_missing" >&2
          cat artifacts/medusa-db-contract.json >&2
          exit 1

      - name: Stop after dry-run preflight
        if: inputs.dryRun == 'true'
        run: |
          echo "dryRun=true requested; DB contract preflight completed and the real seed was not run. Set dryRun=false for the actual first CJ product seed."

      - name: Run first CJ product seed job
        if: inputs.dryRun == 'false'
        env:
          DBX_CONFIRM_CJ_FIRST_PRODUCT_SEED: "true"
          DRY_RUN: ${{ inputs.dryRun }}
        run: pnpm --filter @dbaronx/medusa run first-product:seed:cj-shirt

      - name: Ensure shipping readiness
        if: inputs.dryRun == 'false'
        run: pnpm --filter @dbaronx/medusa run shipping:ensure

      - name: Ensure commerce prerequisites
        if: inputs.dryRun == 'false'
        run: pnpm --filter @dbaronx/medusa run commerce:ensure

      - name: Assert seed and commerce readiness outputs
        if: inputs.dryRun == 'false'
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          function read(path) {
            if (!fs.existsSync(path)) throw new Error(`${path} was not created.`);
            return JSON.parse(fs.readFileSync(path, 'utf8'));
          }
          const seed = read('artifacts/medusa-first-product-seed-output.json');
          const commerce = read('artifacts/medusa-commerce-ensure-output.json');
          const required = ['success', 'productId', 'variantId', 'handle', 'title', 'supplier', 'supplierProductId', 'supplierSku', 'priceReady', 'stockReady', 'salesChannelReady', 'imageReady', 'supplierMetadataReady', 'nextManualStep'];
          const missing = required.filter((key) => !(key in seed));
          if (missing.length) throw new Error(`Seed output missing keys: ${missing.join(', ')}`);
          if (seed.success !== true) throw new Error(`Seed output success !== true; blockers=${JSON.stringify(seed.blockers || [])}`);
          if (commerce.productReady !== true) throw new Error(`Commerce productReady !== true; blockers=${JSON.stringify(commerce.blockers || [])}`);
          console.log(JSON.stringify({ success: true, productId: seed.productId, variantId: seed.variantId, productReady: commerce.productReady }, null, 2));
          NODE

      - name: Upload Medusa seed artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: medusa-first-product-seed-artifacts
          path: |
            artifacts/medusa-db-contract.json
            artifacts/medusa-first-product-seed-output.json
            artifacts/medusa-commerce-ensure-output.json
          if-no-files-found: warn
