[build-system]
requires = ["setuptools>=69.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dbaronx-fastapi"
version = "1.0.0"
description = "dBaronX FastAPI intelligence layer for fraud scoring, watch validation, AI orchestration, moderation, and telemetry analysis."
readme = "README.md"
requires-python = ">=3.11,<3.13"
authors = [
  { name = "dBaronX" }
]
dependencies = [
  "fastapi>=0.115.0,<1.0.0",
  "uvicorn[standard]>=0.30.0,<1.0.0",
  "pydantic>=2.8.0,<3.0.0",
  "pydantic-settings>=2.4.0,<3.0.0",
  "httpx>=0.27.0,<1.0.0",
  "anthropic>=0.40.0,<1.0.0",
  "openai>=1.54.0,<2.0.0",
  "google-generativeai>=0.8.0,<1.0.0",
  "orjson>=3.10.0,<4.0.0",
  "redis>=5.0.0,<6.0.0",
  "supabase>=2.7.0,<3.0.0",
  "python-json-logger>=2.0.7,<3.0.0",
  "tenacity>=8.5.0,<9.0.0",
  "structlog>=24.4.0,<25.0.0",
  "python-dotenv>=1.0.1,<2.0.0",
  "PyJWT>=2.9.0,<3.0.0",
  "cryptography>=43.0.0,<44.0.0",
  "cachetools>=5.5.0,<6.0.0",
  "anyio>=4.4.0,<5.0.0",
  "typing-extensions>=4.12.0,<5.0.0"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0,<9.0.0",
  "pytest-asyncio>=0.24.0,<1.0.0",
  "pytest-cov>=5.0.0,<6.0.0",
  "ruff>=0.6.0,<1.0.0",
  "mypy>=1.11.0,<2.0.0",
  "types-redis>=4.6.0.20241004",
  "respx>=0.21.1,<1.0.0"
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src"]

[tool.ruff.lint]
select = [
  "E",
  "F",
  "I",
  "UP",
  "B",
  "SIM",
  "C4",
  "N",
  "ASYNC",
]
ignore = [
  "B008"
]

[tool.pytest.ini_options]
pythonpath = ["src"]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.11"
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
strict_optional = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
pretty = true
exclude = ["tests/"]

[tool.coverage.run]
source = ["src"]
branch = true
