# fly.toml app configuration file generated for dbaronx-ecosystem on 2026-04-29T21:14:05Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'dbaronx-fastapi'
primary_region = 'ams'

[build]

[env]
  PORT = "8080"
  PYTHONPATH = "/app/src"
  

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

  [[http_service.checks]]
    interval = '15s'
    timeout = '5s'
    grace_period = '20s'
    method = 'GET'
    path = '/health'

[[vm]]
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024
