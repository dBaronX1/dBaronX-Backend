# fly.toml app configuration file generated for dbaronx-api-unified on 2026-04-30T14:56:01Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'dbaronx-api-unified'
primary_region = 'ams'

[build]
  dockerfile = 'Dockerfile'

[env]
  HOST = '0.0.0.0'
  NODE_ENV = 'production'
  PORT = '8080'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

  [[http_service.checks]]
    interval = '15s'
    timeout = '5s'
    grace_period = '30s'
    method = 'GET'
    path = '/health'

[[vm]]
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024
