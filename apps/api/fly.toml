# fly.toml app configuration file generated for dbaronx-nestjs on 2026-04-29T22:01:08Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'dbaronx-nestjs'
primary_region = 'ams'

[build]

[env]
  HOST = '0.0.0.0'
  NODE_ENV = 'production'
  PORT = '3001'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

  [[http_service.checks]]
    interval = '15s'
    timeout = '5s'
    grace_period = '20s'
    method = 'GET'
    path = '/'

[[vm]]
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 512
